<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard WebSocket Test</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>관리자 대시보드 실시간 테스트</h2>

<button onclick="connect()">WebSocket 연결</button>
<button onclick="disconnect()">연결 해제</button>

<hr>

<h3>수신 메시지</h3>
<pre id="messages"></pre>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            console.log('WebSocket 연결 성공');

            appendMessage('WebSocket 연결 성공');
            appendMessage('/topic/admin/dashboard 구독 시작');

            stompClient.subscribe('/topic/admin/dashboard', function (message) {
                const data = JSON.parse(message.body);

                console.log('대시보드 수신:', data);

                appendMessage(JSON.stringify(data, null, 2));
            });
        }, function (error) {
            console.error('WebSocket 연결 실패:', error);
            appendMessage('WebSocket 연결 실패: ' + error);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect(function () {
                console.log('WebSocket 연결 해제');
                appendMessage('WebSocket 연결 해제');
            });
        }
    }

    function appendMessage(message) {
        const messages = document.getElementById('messages');
        messages.textContent += message + '\n\n';
    }
</script>
</body>
</html>
