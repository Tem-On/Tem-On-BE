server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: temon-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: commerce-service
              uri: ${COMMERCE_SERVICE_URL:http://commerce:8082}
              predicates:
                - Path=/api/products/**,/api/events/**,/api/event-products/**,/api/admin/products/**,/api/admin/events/**,/api/admin/event-products/**

            - id: queue-stock-service
              uri: ${QUEUE_STOCK_SERVICE_URL:http://queue-stock:8084}
              predicates:
                - Path=/api/queue/**,/api/stocks/**,/api/admin/queue/**,/api/admin/stocks/**,/api/monitoring/**

            - id: order-payment-service
              uri: ${ORDER_PAYMENT_SERVICE_URL:http://order-payment:8083}
              predicates:
                - Path=/api/orders/**,/api/payments/**,/api/admin/orders/**,/api/admin/dashboard/**

            - id: queue-stock-sockjs-info
              uri: ${QUEUE_STOCK_SERVICE_URL:http://queue-stock:8084}
              predicates:
                - Path=/ws/info/**,/ws/info

            - id: queue-stock-websocket
              uri: ${QUEUE_STOCK_WS_URL:ws://queue-stock:8084}
              predicates:
                - Path=/ws/**

            - id: auth-service-docs
              uri: ${AUTH_SERVICE_URL:http://auth:8081}
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

            - id: commerce-service-docs
              uri: ${COMMERCE_SERVICE_URL:http://commerce:8082}
              predicates:
                - Path=/commerce-service/v3/api-docs
              filters:
                - RewritePath=/commerce-service/v3/api-docs, /v3/api-docs

            - id: queue-stock-service-docs
              uri: ${QUEUE_STOCK_SERVICE_URL:http://queue-stock:8084}
              predicates:
                - Path=/queue-stock-service/v3/api-docs
              filters:
                - RewritePath=/queue-stock-service/v3/api-docs, /v3/api-docs

            - id: order-payment-service-docs
              uri: ${ORDER_PAYMENT_SERVICE_URL:http://order-payment:8083}
              predicates:
                - Path=/order-payment-service/v3/api-docs
              filters:
                - RewritePath=/order-payment-service/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: auth-service
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: commerce-service
        url: /commerce-service/v3/api-docs
      - name: queue-stock-service
        url: /queue-stock-service/v3/api-docs
      - name: order-payment-service
        url: /order-payment-service/v3/api-docs

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}