<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Tem-On WebSocket Test</title>
</head>
<body>

<h2>실시간 재고 테스트</h2>

<label>
    Event Product ID :
    <input id="eventProductId" value="1">
</label>

<br><br>

<label>
    Access Token :
    <input id="token" style="width:600px">
</label>

<br><br>

<button onclick="connect()">연결</button>

<hr>

<h3>남은 재고 : <span id="remaining">-</span></h3>
<h3>예약 재고 : <span id="reserved">-</span></h3>
<h3>판매 재고 : <span id="sold">-</span></h3>

<hr>

<h3>로그</h3>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;

    function connect() {
        const eventProductId = document.getElementById("eventProductId").value;
        const token = document.getElementById("token").value;

        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect(
            {
                Authorization: "Bearer " + token
            },
            function () {
                log("WebSocket 연결 성공");
                log("구독 시작 : /topic/stocks/" + eventProductId);

                stompClient.subscribe("/topic/stocks/" + eventProductId, function (message) {
                    const stock = JSON.parse(message.body);

                    document.getElementById("remaining").innerText = stock.remainingQuantity;
                    document.getElementById("reserved").innerText = stock.reservedQuantity;
                    document.getElementById("sold").innerText = stock.soldQuantity;

                    log("메시지 수신");
                    log(message.body);
                });
            },
            function (error) {
                log("WebSocket 연결 실패");
                log(error);
            }
        );
    }

    function log(message) {
        document.getElementById("log").innerText += message + "\n";
    }
</script>

</body>
</html>
