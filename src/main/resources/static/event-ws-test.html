<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Event WebSocket Test</title>
</head>
<body>

<h2>실시간 이벤트 상태 테스트</h2>

<button onclick="connect()">연결</button>

<hr>

<h3>Event ID : <span id="eventId">-</span></h3>
<h3>제목 : <span id="title">-</span></h3>
<h3>상태 : <span id="status">-</span></h3>

<hr>

<h3>로그</h3>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>

    let stompClient = null;

    function connect() {

        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            log("WebSocket 연결 성공");
            log("구독 시작 : /topic/events");

            stompClient.subscribe(
                "/topic/events",
                function (message) {

                    const event =
                        JSON.parse(message.body);

                    document.getElementById("eventId").innerText =
                        event.eventId;

                    document.getElementById("title").innerText =
                        event.title;

                    document.getElementById("status").innerText =
                        event.status;

                    log("메시지 수신");
                    log(message.body);
                }
            );
        });
    }

    function log(message) {
        document.getElementById("log").innerText += message + "\n";
    }

</script>

</body>
</html>
