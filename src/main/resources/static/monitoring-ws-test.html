<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Monitoring WebSocket Test</title>
</head>
<body>

<h2>실시간 모니터링 테스트</h2>

<label>
    Access Token :
    <input id="token" style="width:600px">
</label>

<br><br>

<button onclick="connect()">연결</button>
<button onclick="disconnect()">연결 해제</button>

<hr>

<h3>Kafka 상태 : <span id="kafka">-</span></h3>
<h3>Redis 상태 : <span id="redis">-</span></h3>
<h3>WebSocket 접속자 수 : <span id="websocket">-</span></h3>
<h3>확인 시간 : <span id="checkedAt">-</span></h3>

<hr>

<h3>로그</h3>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;

    function connect() {
        const token = document.getElementById("token").value;

        const socket = new SockJS("http://localhost:8080/ws");
        stompClient = Stomp.over(socket);

        // STOMP 디버그 로그 출력
        stompClient.debug = function (str) {
            console.log(str);
        };

        stompClient.connect(
            {
                Authorization: "Bearer " + token
            },
            function () {
                log("WebSocket 연결 성공");
                log("구독 시작 : /topic/monitoring");

                stompClient.subscribe("/topic/monitoring", function (message) {
                    const data = JSON.parse(message.body);

                    document.getElementById("kafka").innerText =
                        data.kafka.status +
                        " (Broker : " + data.kafka.brokerCount + ")";

                    document.getElementById("redis").innerText =
                        data.redis.status +
                        " (Clients : " + data.redis.connectedClients + ")";

                    document.getElementById("websocket").innerText =
                        data.websocket.connectedUsers;

                    document.getElementById("checkedAt").innerText =
                        data.checkedAt;

                    log("모니터링 수신");
                    log(message.body);
                });
            },
            function (error) {
                log("WebSocket 연결 실패");
                log(error);
            }
        );
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect(function () {
                log("WebSocket 연결 종료");
            });
        }
    }

    function log(message) {
        const logArea = document.getElementById("log");
        logArea.innerText += message + "\n";
        logArea.scrollTop = logArea.scrollHeight;
    }
</script>

</body>
</html>
