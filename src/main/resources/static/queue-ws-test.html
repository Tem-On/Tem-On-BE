<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Queue WebSocket Test</title>
</head>
<body>

<h2>실시간 대기열 테스트</h2>

<label>
    Event Product ID :
    <input id="eventProductId" value="1">
</label>

<button onclick="connect()">연결</button>

<hr>

<h3>현재 대기 인원 : <span id="currentUsers">-</span></h3>
<h3>메시지 : <span id="message">-</span></h3>

<hr>

<h3>로그</h3>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;

    function connect() {
        const eventProductId = document.getElementById("eventProductId").value;

        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            log("WebSocket 연결 성공");
            log("구독 시작 : /topic/queue/" + eventProductId);

            stompClient.subscribe("/topic/queue/" + eventProductId, function (message) {
                const queue = JSON.parse(message.body);

                document.getElementById("currentUsers").innerText = queue.currentUsers;
                document.getElementById("message").innerText = queue.message;

                log("메시지 수신");
                log(message.body);
            });
        });
    }

    function log(message) {
        document.getElementById("log").innerText += message + "\n";
    }
</script>

</body>
</html>
