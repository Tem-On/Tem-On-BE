name: Build, Push and Deploy Backend Images

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: temon-dev-eks
  K8S_NAMESPACE: temon

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: temon-auth-service
            repository: temon-auth
            deployment: auth
            container: auth

          - service: temon-commerce-service
            repository: temon-commerce
            deployment: commerce
            container: commerce

          - service: temon-gateway
            repository: temon-gateway
            deployment: gateway
            container: gateway

          - service: temon-order-payment-service
            repository: temon-order-payment
            deployment: order-payment
            container: order-payment

          - service: temon-queue-stock-service
            repository: temon-queue-stock
            deployment: queue-stock
            container: queue-stock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-tag
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t $ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ matrix.repository }}:latest \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push $ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.repository }}:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          kubectl set image \
            deployment/${{ matrix.deployment }} \
            ${{ matrix.container }}=$ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl rollout status \
            deployment/${{ matrix.deployment }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s