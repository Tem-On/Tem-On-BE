name: Build and Push Backend Images to ECR

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: temon-auth-service
            repository: temon-auth

          - service: temon-commerce-service
            repository: temon-commerce

          - service: temon-gateway
            repository: temon-gateway

          - service: temon-order-payment-service
            repository: temon-order-payment

          - service: temon-queue-stock-service
            repository: temon-queue-stock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t $ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ matrix.repository }}:latest \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push $ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.repository }}:latest