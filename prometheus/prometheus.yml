global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "temon-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8080"

  - job_name: "temon-auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8081"

  - job_name: "temon-commerce-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8082"

  - job_name: "temon-order-payment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8083"

  - job_name: "temon-queue-stock-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:8084"